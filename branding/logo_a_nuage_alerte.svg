<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SAMCAM — Variante A : nuage + alerte (point d'exclamation en découpe) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8A96"/>
      <stop offset="1" stop-color="#014A52"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="white"/>
      <!-- point d'exclamation découpé dans le nuage -->
      <rect x="487" y="405" width="56" height="145" rx="28" fill="black"/>
      <circle cx="515" cy="602" r="30" fill="black"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- nuage -->
  <g fill="#FFFFFF" mask="url(#cut)">
    <circle cx="380" cy="520" r="118"/>
    <circle cx="540" cy="450" r="155"/>
    <circle cx="680" cy="530" r="105"/>
    <rect x="370" y="520" width="320" height="118" rx="59"/>
  </g>

  <!-- pluie -->
  <g fill="#A5E6EF">
    <rect x="383" y="700" width="34" height="110" rx="17" transform="rotate(20 400 755)"/>
    <rect x="523" y="700" width="34" height="110" rx="17" transform="rotate(20 540 755)"/>
    <rect x="663" y="700" width="34" height="110" rx="17" transform="rotate(20 680 755)"/>
  </g>
</svg>
