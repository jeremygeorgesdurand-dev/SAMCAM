<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SAMCAM — Variante B : repère géographique + alerte + ondes de diffusion -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8A96"/>
      <stop offset="1" stop-color="#014A52"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- ondes de diffusion de l'alerte -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round">
    <path d="M252 250 A300 300 0 0 0 252 550"/>
    <path d="M772 250 A300 300 0 0 1 772 550"/>
  </g>

  <!-- pin de localisation -->
  <g fill="#FFFFFF">
    <circle cx="512" cy="400" r="225"/>
    <path d="M330 560 L512 840 L694 560 Z"/>
  </g>

  <!-- disque intérieur -->
  <circle cx="512" cy="400" r="142" fill="#01565F"/>

  <!-- point d'exclamation ambre -->
  <g fill="#FFB74D">
    <rect x="488" y="308" width="48" height="112" rx="24"/>
    <circle cx="512" cy="474" r="27"/>
  </g>
</svg>
