<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SAMCAM — Variante C : soleil + nuage + pluie (météo complète, ton chaleureux) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8A96"/>
      <stop offset="1" stop-color="#014A52"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- soleil -->
  <g fill="#FFD54F">
    <circle cx="380" cy="380" r="130"/>
    <g>
      <rect x="362" y="142" width="36" height="78" rx="18"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(45 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(90 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(135 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(180 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(225 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(270 380 380)"/>
      <rect x="362" y="142" width="36" height="78" rx="18" transform="rotate(315 380 380)"/>
    </g>
  </g>

  <!-- nuage -->
  <g fill="#FFFFFF">
    <circle cx="520" cy="560" r="110"/>
    <circle cx="655" cy="500" r="140"/>
    <circle cx="785" cy="570" r="95"/>
    <rect x="510" y="560" width="370" height="105" rx="52"/>
  </g>

  <!-- pluie -->
  <g fill="#A5E6EF">
    <rect x="543" y="720" width="34" height="105" rx="17" transform="rotate(20 560 772)"/>
    <rect x="663" y="720" width="34" height="105" rx="17" transform="rotate(20 680 772)"/>
    <rect x="783" y="720" width="34" height="105" rx="17" transform="rotate(20 800 772)"/>
  </g>
</svg>
